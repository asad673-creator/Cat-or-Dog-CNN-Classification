<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bone Fracture Predictor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tensorflow/4.17.0/tf.min.js"></script>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 480px;
    margin: 60px auto;
    text-align: center;
    color: #222;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; }
  #dropzone {
    border: 2px dashed #999;
    border-radius: 10px;
    padding: 30px;
    margin-top: 20px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  #dropzone.dragover { border-color: #3b82f6; background: #eff6ff; }
  #preview {
    max-width: 100%;
    max-height: 300px;
    margin-top: 16px;
    border-radius: 8px;
    display: none;
  }
  #result {
    margin-top: 20px;
    font-size: 1.2rem;
    font-weight: 600;
    min-height: 1.5em;
  }
  #result.fracture { color: #dc2626; }
  #result.no-fracture { color: #16a34a; }
  #confidence { color: #666; font-size: 0.9rem; }
  input[type="file"] { display: none; }
  #status { color: #666; font-size: 0.9rem; margin-top: 8px; }
</style>
</head>
<body>

<h1>Bone Fracture Predictor</h1>
<p class="sub">Upload an X-ray image to check for a fracture</p>

<div id="dropzone">
  <p>Click or drag an image here</p>
  <input type="file" id="fileInput" accept="image/*">
</div>

<img id="preview" alt="X-ray preview">
<div id="status">Loading model...</div>
<div id="result"></div>
<div id="confidence"></div>

<script>
// ---------------------------------------------------------------
// SETUP NOTE:
// This expects the tfjs "graph model" produced by tensorflowjs_converter
// (model.json + a group1-shard1of1.bin weight file). Host both files
// alongside this HTML page and point MODEL_URL at model.json.
//
// The converted model has an internal Rescaling layer, so it wants raw
// 0-255 pixel values as input -- do NOT divide by 255 yourself, or
// predictions will be wrong.
// ---------------------------------------------------------------

const MODEL_URL = "model.json";
const IMG_SIZE = 256;

let model = null;
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const confidenceEl = document.getElementById("confidence");
const previewEl = document.getElementById("preview");
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");

async function loadTheModel() {
  try {
    model = await tf.loadGraphModel(MODEL_URL);
    statusEl.textContent = "Model loaded. Ready.";
  } catch (err) {
    statusEl.textContent = "Could not load model — check MODEL_URL path.";
    console.error(err);
  }
}
loadTheModel();

dropzone.addEventListener("click", () => fileInput.click());

dropzone.addEventListener("dragover", (e) => {
  e.preventDefault();
  dropzone.classList.add("dragover");
});
dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
dropzone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropzone.classList.remove("dragover");
  if (e.dataTransfer.files.length) {
    handleFile(e.dataTransfer.files[0]);
  }
});

fileInput.addEventListener("change", () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    previewEl.src = e.target.result;
    previewEl.style.display = "block";
    previewEl.onload = () => predict(previewEl);
  };
  reader.readAsDataURL(file);
}

async function predict(imgEl) {
  if (!model) {
    resultEl.textContent = "Model not loaded yet.";
    return;
  }

  resultEl.textContent = "";
  resultEl.className = "";
  confidenceEl.textContent = "";
  statusEl.textContent = "Predicting...";

  // Preprocess: resize to 256x256, keep raw 0-255 range, add batch dim.
  // (The model's own Rescaling layer normalizes internally.)
  const tensor = tf.tidy(() => {
    return tf.browser.fromPixels(imgEl, 3)
      .resizeBilinear([IMG_SIZE, IMG_SIZE])
      .toFloat()
      .expandDims(0);
  });

  const prediction = model.execute(tensor);
  const value = (await prediction.data())[0];

  tensor.dispose();
  prediction.dispose();

  if (value > 0.5) {
    resultEl.textContent = "Prediction: Fracture";
    resultEl.className = "fracture";
  } else {
    resultEl.textContent = "Prediction: No Fracture";
    resultEl.className = "no-fracture";
  }
  confidenceEl.textContent = `Raw score: ${value.toFixed(4)}`;
  statusEl.textContent = "Done.";
}
</script>

</body>
</html>
